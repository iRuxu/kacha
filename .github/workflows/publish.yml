name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check release tag
        run: |
          expected_tag="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF" != "refs/tags/$expected_tag" ]; then
            echo "::error::Select or push the tag $expected_tag for this version."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Check package contents
        run: |
          set -o pipefail
          npm pack --dry-run --json | node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const [pkg] = JSON.parse(readFileSync(0, "utf8"));
            const files = new Set(pkg.files.map(file => file.path));
            for (const path of [
              "bin/kacha.js",
              "bin/init-project.js",
              "bin/lfs-setup.js",
              "bin/lfs-transfer.js",
              "bin/clone-project.js",
              "server/project-storage.js",
              "server/project-scripts.js",
              "server/project-storyboard.js",
              "src/views/scripts/ProjectScripts.vue",
              "src/views/scripts/ProjectStoryboard.vue",
              "skills/manage-assets/SKILL.md",
              "skills/sync-jimeng-assets/SKILL.md",
              "templates/project/.gitattributes",
              "templates/project/README.md",
              "templates/project/AGENTS.md",
              "templates/project/package.json",
              ...["characters", "scenes", "props", "other", "audio"].map(
                kind => `templates/project/assets/${kind}/.gitkeep`
              ),
            ]) {
              assert.ok(files.has(path), `Missing package file: ${path}`);
            }
            assert.ok(![...files].some(path => path.startsWith("creative-templates/")));
            assert.ok(![...files].some(path => /(^|\/)\.env(?:\.|$)/.test(path)));
            const template = JSON.parse(readFileSync("templates/project/package.json", "utf8"));
            assert.equal(template.dependencies[pkg.name], pkg.version);
          '

      - name: Publish to npm with OIDC
        run: npm publish
